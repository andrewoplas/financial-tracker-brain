name: 🧪 Comprehensive Test Suite
on: 
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 6 AM UTC
    - cron: '0 6 * * *'

jobs:
  # Unit and Integration Tests
  unit-tests:
    name: 🔬 Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🚀 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🧪 Run Unit Tests
      run: npm run test -- --coverage
      
    - name: 📊 Upload Coverage Reports
      uses: codecov/codecov-action@v3
      if: always()
      
  # End-to-End Tests
  e2e-tests:
    name: 🎭 E2E Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, mobile-chrome]
        
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🚀 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps
      
    - name: 🏗️ Build Application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        
    - name: 🧪 Run E2E Tests (${{ matrix.browser }})
      run: npx playwright test --project=${{ matrix.browser }}
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        
    - name: 📤 Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.browser }}
        path: |
          playwright-report/
          test-results/
        retention-days: 30
        
  # Performance Tests
  performance-tests:
    name: ⚡ Performance Tests
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🚀 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🎭 Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: 🏗️ Build Application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        
    - name: ⚡ Run Performance Tests
      run: npx playwright test tests/performance/ --project=chromium
      env:
        NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        
    - name: 📊 Generate Lighthouse Report
      run: |
        npm run dev &
        sleep 10
        npm run test:performance
        kill %1
      continue-on-error: true
        
    - name: 📤 Upload Performance Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-reports
        path: tests/performance/
        retention-days: 30

  # Security and Quality Checks
  security-checks:
    name: 🔒 Security & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
    
    - name: 🚀 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🔍 Run ESLint
      run: npm run lint
      continue-on-error: true
      
    - name: 🛡️ Security Audit
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: 📝 Type Check
      run: npx tsc --noEmit
      continue-on-error: true

  # Test Summary
  test-summary:
    name: 📋 Test Summary
    needs: [unit-tests, e2e-tests, performance-tests, security-checks]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📊 Test Results Summary
      run: |
        echo "## 🧪 Test Suite Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| E2E Tests | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Performance | ${{ needs.performance-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security | ${{ needs.security-checks.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🎯 Critical User Journey Status" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Complete user signup → wallets → transactions flow" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Wallet creation regression protection" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Cross-browser compatibility (Desktop + Mobile)" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Performance benchmarks validation" >> $GITHUB_STEP_SUMMARY
